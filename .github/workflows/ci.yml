name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installera beroenden
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Enhetstester
        run: npm run test

      - name: Bygg
        run: npm run build

      - name: Kontrollera Cloud Functions-syntax
        run: node -c functions/index.js
