name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installera beroenden
        run: npm ci

      - name: Installera functions-beroenden
        run: npm ci
        working-directory: functions

      - name: Lint
        run: npm run lint

      - name: Enhetstester
        run: npm run test

      - name: Regeltester (Firestore-emulator)
        run: npm run test:rules

      - name: Functions-tester (Firestore- + Storage-emulator)
        run: npm run test:functions

      - name: Storage-regeltester (Firestore- + Storage-emulator)
        run: npm run test:storage

      - name: Bygg
        run: npm run build

      - name: Kontrollera Cloud Functions-syntax
        run: node -c functions/index.js

      - name: Beroendegranskning (npm audit, rapporterar men blockerar inte)
        if: always()
        run: node scripts/npm-audit-rapport.mjs
