name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # firebase-tools@14+ kräver JDK 21 för Firestore-/Storage-emulatorerna (Java-baserade):
      # "firebase-tools no longer supports Java version before 21." Se OPPNA-PUNKTER.md
      # (2026-09-08) för bakgrunden till bumpen från ^13.35.1.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Installera beroenden
        run: npm ci

      - name: Installera functions-beroenden
        run: npm ci
        working-directory: functions

      - name: Lint
        run: npm run lint

      - name: Enhetstester
        run: npm run test

      - name: Regeltester (Firestore-emulator)
        run: npm run test:rules

      - name: Functions-tester (Firestore- + Storage-emulator)
        run: npm run test:functions

      - name: Storage-regeltester (Firestore- + Storage-emulator)
        run: npm run test:storage

      - name: Installera Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E-tester (organisationsisolering + list-provability, Firestore-/Auth-/Storage-emulator)
        run: npm run test:e2e

      - name: Bygg
        run: npm run build

      - name: Kontrollera Cloud Functions-syntax
        run: node -c functions/index.js

      - name: Beroendegranskning (npm audit, rapporterar men blockerar inte)
        if: always()
        run: node scripts/npm-audit-rapport.mjs
