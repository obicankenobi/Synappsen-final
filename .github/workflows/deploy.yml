name: Deploy till Firebase

on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Skapa .env med Firebase-konfiguration
        run: |
          cat > .env <<'EOF'
          VITE_FIREBASE_API_KEY=AIzaSyBAZmfLrM_bjC9IuvRQEw8hp87AvvARsTk
          VITE_FIREBASE_AUTH_DOMAIN=synappsen-final-build.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID=synappsen-final-build
          VITE_FIREBASE_STORAGE_BUCKET=synappsen-final-build.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID=773838769422
          VITE_FIREBASE_APP_ID=1:773838769422:web:2f9cdc586378cdc5145b5f
          VITE_SENTRY_DSN=https://c9f27406c8d174a27212d88dca1acaf9@o4511801594281984.ingest.de.sentry.io/4511801670107216
          VITE_RECAPTCHA_SITE_KEY=6LcGxmYtAAAAAO1Hangg-bTwTjNKWld2Uizq5ZE6
          VITE_FIREBASE_VAPID_KEY=${{ secrets.FIREBASE_VAPID_KEY }}
          EOF

      - name: Installera frontend-beroenden
        run: npm ci

      # Deployen körs manuellt (workflow_dispatch) och kan därför startas från en commit där
      # CI är röd – ci.yml är en helt separat workflow utan koppling hit. Eftersom
      # "firebase deploy --force" nedan även skickar med firestore.rules/storage.rules kan ett
      # regelfel annars nå produktion utan att regeltesterna någonsin körts. Stegen nedan är
      # samma kommandon som ci.yml kör, i samma ordning, och får jobbet att faila – då hoppas
      # alla efterföljande steg (inklusive deployen) över.
      - name: Lint
        run: npm run lint

      - name: Enhetstester
        run: npx vitest run

      - name: Regeltester (Firestore-emulator)
        run: npm run test:rules

      - name: Bygg frontend
        run: npm run build

      - name: Skapa .env med Sentry-/e-postkonfiguration för Cloud Functions
        run: |
          cat > functions/.env <<'EOF'
          SENTRY_DSN=https://da30c8927ae17c2eed23e57ccedbd281@o4511801594281984.ingest.de.sentry.io/4511801671155792
          EPOST_AVSANDARE=noreply@synappsen.se
          EOF

      - name: Installera functions-beroenden
        run: npm ci
        working-directory: functions

      - name: Autentisera mot Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Installera Firebase CLI
        run: npm install -g firebase-tools

      - name: Sätt Gemini-nyckeln i Secret Manager
        run: printf '%s' "${{ secrets.GEMINI_API_KEY }}" | firebase functions:secrets:set GEMINI_API_KEY --data-file=- --project synappsen-final-build --force

      - name: Sätt sökmotor-nyckeln i Secret Manager
        run: printf '%s' "${{ secrets.SOKMOTOR_API_KEY }}" | firebase functions:secrets:set SOKMOTOR_API_KEY --data-file=- --project synappsen-final-build --force

      - name: Sätt Brevo-nyckeln (e-post, Etapp 53a) i Secret Manager
        # OBS: printf '%s' – INTE echo. echo lägger till en radbrytning, så en saknad
        # GitHub-hemlighet blev "\n" i Secret Manager i stället för tom sträng. "\n" är
        # truthy i JS, vilket gjorde att skickaEpost():s "inte konfigurerad"-guard aldrig slog
        # till – den anropade Brevo med api-key: "\n" och fick 401 "authentication not found
        # in headers", som larmade i Sentry i produktion 2026-08-26. Samma fel fanns i de två
        # raderna ovan. Sätt den riktiga hemligheten i Settings → Secrets.
        run: printf '%s' "${{ secrets.BREVO_API_KEY }}" | firebase functions:secrets:set BREVO_API_KEY --data-file=- --project synappsen-final-build --force

      - name: Deploya till Firebase
        run: firebase deploy --project synappsen-final-build --non-interactive --force

      - name: Sätt cleanup policy för container-images
        run: firebase functions:artifacts:setpolicy --location=europe-west1 --project=synappsen-final-build --force
