name: Deploy till Firebase

on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installera frontend-beroenden
        run: npm install

      - name: Bygg frontend
        run: npm run build

      - name: Installera functions-beroenden
        run: npm install
        working-directory: functions

      - name: Autentisera mot Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Installera Firebase CLI
        run: npm install -g firebase-tools

      - name: Sätt Gemini-nyckeln i Secret Manager
        run: echo "${{ secrets.GEMINI_API_KEY }}" | firebase functions:secrets:set GEMINI_API_KEY --data-file=- --project synappsen-final-build --force

      - name: Deploya till Firebase
        run: firebase deploy --project synappsen-final-build --non-interactive
