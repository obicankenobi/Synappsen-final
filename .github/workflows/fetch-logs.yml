name: Hämta Cloud Function-loggar

on:
  workflow_dispatch: {}

jobs:
  fetch-logs:
    runs-on: ubuntu-latest
    steps:
      - name: Autentisera mot Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Sätt upp gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Hämta senaste loggarna för tolkaForradsbild
        run: |
          gcloud logging read \
            'resource.type="cloud_run_revision" AND resource.labels.service_name="tolkaforradsbild"' \
            --project=synappsen-final-build \
            --limit=100 \
            --format="table(timestamp, severity, textPayload)" \
            --freshness=1d

      - name: Hämta senaste loggarna för tolkaDokument
        run: |
          gcloud logging read \
            'resource.type="cloud_run_revision" AND resource.labels.service_name="tolkadokument"' \
            --project=synappsen-final-build \
            --limit=100 \
            --format="table(timestamp, severity, textPayload)" \
            --freshness=1d
