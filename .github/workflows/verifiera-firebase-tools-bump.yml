name: Verifiera firebase-tools-version mot functions- och storage-emulatorn

# Manuellt diagnosverktyg (ALDRIG på push) – kör INNAN någon höjer firebase-tools i
# rot-package.json. Byggt 2026-09-06/08 sedan firebase-tools@13.35.1 visade sig köra en
# emulatorruntime som anropar functions.config() – borttaget i firebase-functions@7
# (functions/package.json) – vilket dödar VARJE Cloud Function-anrop via emulatorn med
# "Your function was killed because it raised an unhandled error", trots att alla ~100
# funktionsdefinitioner laddas rent. Se OPPNA-PUNKTER.md för hela bakgrunden.
#
# STATUS 2026-09-08, SLUTFÖRD: firebase-tools är bumpat till ^15.29.0 (commit 0c2ad92 +
# uppföljande bump). Så här löstes det:
#
# 1. firebase-tools@15.29.0 fixar functions.config()-buggen (bevisat i en riktig CI-körning:
#    rapporteraAppVersion kördes, gick igenom callable-verifiering och budgetkontroll, svarade
#    med ett riktigt HttpsError – inget kraschat).
# 2. Ett ANNAT fel dök då upp: admin.firestore.FieldValue.serverTimestamp() kraschade med
#    "Cannot read properties of undefined". Grundorsak: firebase-tools egen
#    functionsEmulatorRuntime.js gör value.bind(target) på admin.firestore för att stubba den
#    – och Function.prototype.bind() kopierar aldrig med statiska egenskaper som FieldValue/
#    Timestamp. IDENTISK, oförändrad kod i v13.35.1/v14.27.0/v15.29.0 – i v13 bara osynlig
#    eftersom functions.config()-kraschen träffade tidigare. Fixat på VÅR sida: direktimport av
#    { FieldValue, Timestamp } från "firebase-admin/firestore" (88 ställen, 14 filer) går inte
#    via den trasiga proxyn.
# 3. En tredje, till synes DISKVALIFICERANDE regression visade sig vara FALSK: en lokal
#    A/B-körning av tests/rules/storage.test.mjs gav 24/0 på v13 mot 18/6 på v15.29.0
#    ("Null value error" i minOrganisation()/minRoll(), cross-service firestore.get() FRÅN
#    storage.rules). En riktig CI-körning av samma testfil mot v15.29.0 gav 24/0 – IDENTISKT
#    med v13, två separata gånger. Den lokala siffran var ett sandboxartefakt (samma
#    nätverksbegränsning som stör eventarc-registrering lokalt), inte ett äkta
#    firebase-tools-fel. Lärdom: verifiera alltid ett misstänkt regelmotorfel mot riktig CI
#    innan det dokumenteras som blockerande.
#
# Använd fortfarande det här verktyget vid NÄSTA firebase-tools-bump (samma två steg täcker
# functions.config()-klassen av fel och regelmotorregressioner) – men lita på CI-resultatet,
# inte på ett lokalt sandboxresultat, om de går isär.
#
# En separat observation värd att spara: tre manuella körningar av det här verktyget verkade
# hänga i flera minuter och avbröts i onödan. Efterkontroll (jämförelse av
# created_at/updated_at i GitHub Actions API:et) visade att var och en bara hunnit köra i
# 65–100 SEKUNDER innan avbrottet – normal tid för att ladda ~90 funktionsdefinitioner, inte
# en hängning. Döm alltid på faktiska tidsstämplar, inte på egen känsla för förfluten tid.
#
# Ändrar INGENTING i repot – testar bara `npx firebase-tools@<version>` mot den redan
# skrivna koden.
on:
  workflow_dispatch:
    inputs:
      firebase_tools_version:
        description: "firebase-tools-version att prova (t.ex. 15.30.0 eller 16 för senaste 16.x)"
        required: true
        default: "latest"

jobs:
  verifiera:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # firebase-tools@14+ kräver JDK 21 för Firestore-/Storage-emulatorerna (Java-baserade).
      # ubuntu-latest-imagens förvalda JDK räcker inte: "firebase-tools no longer supports
      # Java version before 21." Sandboxen där arbetet ursprungligen gjordes råkade redan ha
      # JDK 21 installerat, vilket dolde kravet helt.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Installera rot-beroenden (klient-SDK:t verifieringsskriptet använder)
        run: npm ci

      - name: Installera functions-beroenden (koden som faktiskt ska köras i emulatorn)
        run: npm ci
        working-directory: functions

      - name: Visa vilken firebase-tools-version som testas
        run: npx --yes firebase-tools@${{ inputs.firebase_tools_version }} --version

      - name: Functions-test – anropa en riktig funktion, inte bara ladda den
        run: |
          npx --yes firebase-tools@${{ inputs.firebase_tools_version }} emulators:exec \
            --project demo-test --only auth,firestore,functions,storage \
            "node scripts/verifiera-functions-emulator.mjs"

      - name: Storage-regeltest – cross-service firestore.get()/exists() FRÅN storage.rules
        if: always()
        run: |
          npx --yes firebase-tools@${{ inputs.firebase_tools_version }} emulators:exec \
            --project demo-test --only firestore,storage \
            "node tests/rules/storage.test.mjs"
