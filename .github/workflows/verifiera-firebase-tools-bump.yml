name: Verifiera firebase-tools-version mot functions- och storage-emulatorn

# Manuellt diagnosverktyg (ALDRIG på push) – kör INNAN någon höjer firebase-tools i
# rot-package.json. Byggt 2026-09-06/08 sedan firebase-tools@13.35.1 visade sig köra en
# emulatorruntime som anropar functions.config() – borttaget i firebase-functions@7
# (functions/package.json) – vilket dödar VARJE Cloud Function-anrop via emulatorn med
# "Your function was killed because it raised an unhandled error", trots att alla ~100
# funktionsdefinitioner laddas rent. Se OPPNA-PUNKTER.md för hela bakgrunden.
#
# STATUS 2026-09-08: firebase-tools@15.29.0 fixar functions.config()-buggen (bevisat i en
# riktig CI-körning: rapporteraAppVersion kördes, gick igenom callable-verifiering och
# budgetkontroll, svarade med ett riktigt HttpsError – inget kraschat). MEN samma version
# introducerar en NY, separat, DISKVALIFICERANDE regression: Storage-regelmotorns
# cross-service-uppslag mot Firestore (firestore.get()/firestore.exists() anropade FRÅN
# storage.rules, t.ex. minOrganisation() och minRoll()) ger "Null value error" på fall som
# SKA gå igenom. Bevisat lokalt med en ren A/B-körning av samma testfil:
#   firebase-tools@13.35.1: 24 klarade, 0 misslyckade
#   firebase-tools@15.29.0: 18 klarade, 6 misslyckade ("Null value error" på multi-tenant-
#   isoleringsregler – exakt den sortens regel det här projektet är som mest noga med)
# Reproducerbart utan CI, se kommandot i steget "Storage-regeltest" nedan.
#
# Slutsats: BUMPA INTE till 15.29.0. Kör det här verktyget mot en NYARE firebase-tools-
# version (patch/minor efter 15.29.0, eller en framtida 16.x) när en sådan finns, och bumpa
# bara om BÅDA stegen nedan är gröna – inte bara functions-anropet.
#
# En separat, ANNAN observation från samma dag hör INTE hemma i "diskvalificerande": tre
# manuella körningar av det här verktyget verkade hänga i flera minuter och avbröts. Vid
# efterkontroll (jämförelse av created_at/updated_at i GitHub Actions API:et) visade det sig
# att var och en bara hunnit köra i 65–100 SEKUNDER innan avbrottet – normal tid för att ladda
# ~90 funktionsdefinitioner, inte en hängning. Den slutsatsen drogs för snabbt förra gången;
# ha den här kommentaren i åtanke innan du avbryter en körning som "verkar hänga" – jämför
# faktisk starttid mot nutid, lita inte på att API-statusfältet uppdaterats.
#
# Ändrar INGENTING i repot – testar bara `npx firebase-tools@<version>` mot den redan
# skrivna koden.
on:
  workflow_dispatch:
    inputs:
      firebase_tools_version:
        description: "firebase-tools-version att prova (t.ex. 15.30.0 eller 16 för senaste 16.x)"
        required: true
        default: "latest"

jobs:
  verifiera:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # firebase-tools@14+ kräver JDK 21 för Firestore-/Storage-emulatorerna (Java-baserade).
      # ubuntu-latest-imagens förvalda JDK räcker inte: "firebase-tools no longer supports
      # Java version before 21." Sandboxen där arbetet ursprungligen gjordes råkade redan ha
      # JDK 21 installerat, vilket dolde kravet helt.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Installera rot-beroenden (klient-SDK:t verifieringsskriptet använder)
        run: npm ci

      - name: Installera functions-beroenden (koden som faktiskt ska köras i emulatorn)
        run: npm ci
        working-directory: functions

      - name: Visa vilken firebase-tools-version som testas
        run: npx --yes firebase-tools@${{ inputs.firebase_tools_version }} --version

      - name: Functions-test – anropa en riktig funktion, inte bara ladda den
        run: |
          npx --yes firebase-tools@${{ inputs.firebase_tools_version }} emulators:exec \
            --project demo-test --only auth,firestore,functions,storage \
            "node scripts/verifiera-functions-emulator.mjs"

      - name: Storage-regeltest – cross-service firestore.get()/exists() FRÅN storage.rules
        if: always()
        run: |
          npx --yes firebase-tools@${{ inputs.firebase_tools_version }} emulators:exec \
            --project demo-test --only firestore,storage \
            "node tests/rules/storage.test.mjs"
