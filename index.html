<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#274eaf" />
    <meta name="description" content="Synappsen – kunskapsbank för akutmottagningen" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Etapp 44b: Apple stöder officiellt bara PNG för apple-touch-icon (inte SVG som
         manifest.webmanifest annars använder för Android/Chrome) – en egen genererad
         PNG-variant, se public/icons/apple-touch-icon.png. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Synappsen" />
    <title>Synappsen</title>
    <script>
      // Sätter valt tema och accentfärg innan CSS/React laddar, så sidan inte blinkar till
      // fel utseende (samma mönster för båda, se useTema.js/useAccent.js – Etapp 22e).
      (function () {
        try {
          var tema = localStorage.getItem("synappsen-tema");
          if (tema === "light" || tema === "dark") {
            document.documentElement.dataset.tema = tema;
          }
          var accent = localStorage.getItem("synappsen-accent");
          if (accent) {
            document.documentElement.dataset.accent = accent;
          }
        } catch (e) {
          // Privat läge/blockerad lagring – kör bara med standardutseendet
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
