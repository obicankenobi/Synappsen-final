<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Synappsens symbol, variant MED axon. Används från 48 px och uppåt: webbplats,
       presentationer, brevpapper. Under den storleken smälter axonet ihop med
       terminalen och vänstersidan blir grötig, använd symbol.svg i stället.
       Om färgstyrningen, se symbol.svg. -->
  <g transform="translate(0.3 -1.0)" fill="none" stroke="var(--synappsen-symbol, #2563eb)">
    <path d="M 4.9 8.35 L 8.6 10.5" stroke-width="2.0" stroke-linecap="round"/>
    <circle cx="9.8" cy="11.2" r="3.15" fill="var(--synappsen-symbol, #2563eb)" stroke="none"/>
    <path d="M 15.697 9.284 A 6.2 6.2 0 0 1 11.089 17.264"
          stroke-width="2.7" stroke-linecap="round"/>
  </g>
</svg>
