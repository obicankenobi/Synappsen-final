<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Synappsens symbol, variant UTAN axon. Används under 48 px: favikon, knappar,
       listor, notisikon. Se GRAFISK-PROFIL.md för hela systemet.

       Färgen styrs av CSS-variabeln i fill/stroke nedan, med blå fallback. En SVG som
       laddas via en img-tagg är ett eget dokument och ärver inte sidans färg, så
       currentColor hade blivit svart där. Bäddas filen in i markup i stället går
       färgen att styra genom att sätta variabeln på en förälder.

       OBS: skriv aldrig variabelnamnet med sina två inledande bindestreck här inne.
       XML-kommentarer får inte innehålla två bindestreck i rad, och filen slutar då
       renderas helt. Det hände 2026-08-21 och upptäcktes bara för att ikonen
       granskades renderad. -->
  <g transform="translate(0.3 -1.0)" fill="none" stroke="var(--synappsen-symbol, #2563eb)">
    <circle cx="9.8" cy="11.2" r="3.15" fill="var(--synappsen-symbol, #2563eb)" stroke="none"/>
    <path d="M 15.697 9.284 A 6.2 6.2 0 0 1 11.089 17.264"
          stroke-width="2.7" stroke-linecap="round"/>
  </g>
</svg>
