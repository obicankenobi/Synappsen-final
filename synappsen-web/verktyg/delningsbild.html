<!doctype html>
<html lang="sv">
<!-- Mall för delningsbilderna (og:image), 1200 × 630 px. Renderas av delningsbilder.mjs,
     som fyller i {{…}}-fälten och fotograferar sidan. Redigera texterna i skriptet, inte här.
     Färger och typsnitt är sajtens egna (stil.css :root, ljust läge): en förhandsvisning i
     Teams eller ett mejl ska se ut som sidan man sedan landar på. -->
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: "Public Sans"; src: url("/fonts/public-sans-400.woff2") format("woff2"); font-weight: 400; }
  @font-face { font-family: "Public Sans"; src: url("/fonts/public-sans-600.woff2") format("woff2"); font-weight: 600; }
  :root {
    --primar: #2f5fd6; --primar-ljus: #f0f4fc; --text: #0f172a; --text-svag: #475569;
    --bg: #f5f9fa; --yta: #ffffff; --kant: #e2e8f0;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: var(--yta); color: var(--text);
    font-family: "Public Sans", sans-serif; -webkit-font-smoothing: antialiased;
    display: grid; grid-template-rows: auto 1fr auto;
    padding: 68px 84px 60px; position: relative;
    border-top: 10px solid var(--primar);
  }
  .marke { display: flex; align-items: center; gap: 22px; }
  .marke img { width: 84px; height: 84px; }
  .namn { font-size: 46px; font-weight: 600; letter-spacing: -0.028em; line-height: 1; }
  .typ { font-size: 19px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
         color: var(--primar); margin-top: 9px; }
  .budskap { align-self: center; font-size: 66px; font-weight: 600; line-height: 1.08;
             letter-spacing: -0.033em; max-width: 1032px; text-wrap: pretty; }
  .fot { display: flex; justify-content: space-between; align-items: center;
         border-top: 2px solid var(--kant); padding-top: 26px;
         font-size: 26px; color: var(--text-svag); }
  .fot strong { color: var(--text); font-weight: 600; }
</style>
</head>
<body>
  <div class="marke">
    <img src="/icons/symbol-axon.svg" alt="" />
    <div>
      <div class="namn">Synappsen</div>
      <div class="typ">{{TYP}}</div>
    </div>
  </div>
  <p class="budskap">{{BUDSKAP}}</p>
  <div class="fot"><span>{{RAD}}</span><strong>{{ADRESS}}</strong></div>
</body>
</html>
